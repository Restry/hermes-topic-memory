[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-topic-memory"
version = "0.1.0"
description = "Standalone file-based topic memory core and Hermes provider tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes-topic-memory = "hermes_topic_memory.cli:main"
hermes-topic-memory-install = "hermes_topic_memory.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
